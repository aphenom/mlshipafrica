        <!-- perso lié a l'interaction  -->
        <script>
            $(document).ready(function() {
                const separateur = "";

                // choix de jeu public
                $(document).on("click", ".jeu-action", function(e) {
                    // alert("here");
                    // console.log($(this)); // Utilisation correcte de $(this) pour faire référence à l'élément cliqué
                    let partie = $(this).data('partie');
                    let mise = Number(String($(this).data('mise')).replace(/\s/g, ''));
                    let nombre_participants = $(this).data('nombre_participants');
                    let gain = Number(String($(this).data('gain')).replace(/\s/g, ''));
                    let solde = Number(String($(this).data('solde')).replace(/\s/g, ''));
                    let currency = $(this).data('currency');
                    let difference_solde_mise = solde - mise;
                    let minimum_depot = parseInt(String($(this).data('minimum_depot')).replace(/\s/g, ''));
                    let base_url_participer_partie = $('#participer-partie-input-url').val();

                    // remplissons le modal
                    $("#mise-input").val(numStr(mise, separateur));    
                    $("#mise-mise").html(numStr(mise, separateur));    
                    $("#mise-nombre_participants").html(nombre_participants);    
                    $("#mise-gain").html(numStr(gain, separateur));    
                    $("#mise-debit").html(numStr(mise, separateur));    
                    $("#mise-solde").html(numStr(solde, separateur));  

                    if(difference_solde_mise >= 0){
                        $(".mise-solde-bon").show();
                        $(".mise-solde-mauvais").hide();
                        $("#participer-partie-button").attr("href", base_url_participer_partie.replace("complement_url_leurre", String(Date.now())).replace("complement_url_code", partie).replace(/\s/g, ''));
                    }  
                    else{
                        $(".mise-solde-bon").hide();
                        $(".mise-solde-mauvais").show();
                        //$('#recharge-input').attr('data-difference_solde_mise', Math.abs(difference_solde_mise));
                        //$('#recharge-input').attr('data-minimum_depot', minimum_depot);
                        //$("#recharge-input").val(multipleSuperieur(Math.abs(difference_solde_mise), minimum_depot));  
                        $('#recharge-input').remove();
                        $('#recharge-input-container').append('<input id="recharge-input" type="text" class="money_field" value ="' + Math.abs(difference_solde_mise) + '" data-difference_solde_mise="' + Math.abs(difference_solde_mise) + '" data-minimum_depot="' + minimum_depot + '">');
                        $("#recharge-button").attr("href", $("#recharge-input-url").val().replace("complement_url_recharge", String(Math.abs(difference_solde_mise)).replace(/\s/g, '')));
                        //$("#participer-partie-button").attr("href", "javascript:void(0)");
                        applyMoneyFieldMask();
                    }

                });

                        $('.rejoindre_partie_privee-solde-bon').removeClass("d-none");
                        $(".rejoindre_partie_privee-solde-bon").hide();

                        }  
                        else{
                            $(".choix_partie_privee-solde-bon").hide();
                            $(".choix_partie_privee-solde-mauvais").show();
                            $("#creer_partie_privee-btn-creer").attr("href", "javascript:void(0)");

                            //$('#recharge-input').attr('data-minimum_depot', minimum_depot);
                            //$("#recharge-input").val(multipleSuperieur(Math.abs(difference_solde_mise), minimum_depot));  
                            $('#recharge-input').remove();
                            $('#recharge-input-container').append('<input id="recharge-input" type="text" class="money_field" value ="' + Math.abs(difference_solde_mise) + '" data-difference_solde_mise="' + Math.abs(difference_solde_mise) + '" data-minimum_depot="' + minimum_depot + '">');
                            $("#recharge-button").attr("href", $("#recharge-input-url").val().replace("complement_url_recharge", String(Math.abs(difference_solde_mise)).replace(/\s/g, '')));
                            applyMoneyFieldMask();
                        }
                    }
                    else{
                        $(".choix_partie_privee-resume").hide();
                        /* a voir */ $("#participer-partie-button").attr("href", "javascript:void(0)");
                    }

                                $("#rejoindre_partie_privee-gain").html(numStr(gain, separateur));    
                                $("#rejoindre_partie_privee-debit").html(numStr(mise, separateur));    
                                $("#rejoindre_partie_privee-solde").html(numStr(solde, separateur));  
                                
                                // faisons des tours des passe passe cacher / afficher
                                $(".rejoindre_partie_privee-code-erreur").hide();
                                $('.rejoindre_partie_privee-resume').removeClass("d-none");
                                $(".rejoindre_partie_privee-resume").show();

                                if(difference_solde_mise >= 0){
                                    $(".rejoindre_partie_privee-solde-bon").show();
                                    $(".rejoindre_partie_privee-solde-mauvais").hide();
                                    $("#rejoindre_partie_privee-btn-rejoindre").attr("href", base_url_participer_partie.replace("complement_url_leurre", String(Date.now())).replace("complement_url_code", code_partie_privee).replace(/\s/g, ''));
                                }

                                    $(".rejoindre_partie_privee-solde-bon").hide();

                                    //$('#recharge-input').attr('data-difference_solde_mise', Math.abs(difference_solde_mise));
                                    //$('#recharge-input').attr('data-minimum_depot', minimum_depot);
                                    //$("#recharge-input").val(multipleSuperieur(Math.abs(difference_solde_mise), minimum_depot));

                                    $('#recharge-input-container').append('<input id="recharge-input" type="text" class="money_field" value ="' + Math.abs(difference_solde_mise) + '" data-difference_solde_mise="' + Math.abs(difference_solde_mise) + '" data-minimum_depot="' + minimum_depot + '">');
                                    $("#recharge-button").attr("href", $("#recharge-input-url").val().replace("complement_url_recharge", String(Math.abs(difference_solde_mise)).replace(/\s/g, '')));
                                    applyMoneyFieldMask();
                                }
                                
                            } else {
                                $(".rejoindre_partie_privee-solde-bon").hide();

                                $(".rejoindre_partie_privee-code-erreur").html('Désolé, ce code ne correspond à aucune partie privée active !');
                                $(".rejoindre_partie_privee-code-erreur").show();
                            }
                        },
                        error: function(xhr, status, error) { // Si la requête échoue
                            console.error('Erreur lors de la requête:', error);

                            $(".rejoindre_partie_privee-solde-mauvais").hide();
                            $(".rejoindre_partie_privee-resume").hide();

                            $(".rejoindre_partie_privee-code-erreur").show();

                    });

                        let nombre_participants = choix_partie_privee_data[1];
                        let gain = Number(String(choix_partie_privee_data[2]).replace(/\s/g, ''));
                        let solde = Number(String(choix_partie_privee_data[3]).replace(/\s/g, ''));
                        // let currency = $(this).data('currency');
                        let difference_solde_mise = solde - mise;
                        let minimum_depot = Number(String(choix_partie_privee_data[4]).replace(/\s/g, ''));
                        
                        // remplissons le modal
                        $("#choix_partie_privee-input").val(numStr(mise, separateur));

                        $("#choix_partie_privee-gain").html(numStr(gain, separateur));    
                        $("#choix_partie_privee-solde").html(numStr(solde, separateur));  
                        
                        // faisons des tours des passe passe cacher / afficher
                        $('#code_partie_privee').val("");

                        $(".rejoindre_partie_privee-resume").hide();

                        $(".choix_partie_privee-resume").show();

                        if(difference_solde_mise >= 0){

                            $(".choix_partie_privee-solde-bon").hide();
                            $(".choix_partie_privee-solde-mauvais").show();

                            applyMoneyFieldMask();

                    }
                    else{

                });

                // box rechargement 
                $(document).on("change keyup", "#recharge-input", function(e) {
                    // alert("here");
                    // console.log($(this)); // Utilisation correcte de $(this) pour faire référence à l'élément cliqué
                    valeur_input_recharge = Number(String($("#recharge-input").val()).replace(/\s/g, ''));
                    let difference_solde_mise = Number(String($("#recharge-input").data('difference_solde_mise')).replace(/\s/g, ''));
                    let minimum_depot = parseInt(String($("#recharge-input").data('minimum_depot')).replace(/\s/g, ''));
                    let base_url_recharge = $("#recharge-input-url").val();

                    $("#recharge-button").attr("href", base_url_recharge.replace("complement_url_recharge", String($("#recharge-input").val()).replace(/\s/g, '')));
                    $("#recharge-button").show();

                    // remplissons le modal
                    if(valeur_input_recharge >= difference_solde_mise){
                        let check = multipleSuperieur(valeur_input_recharge, minimum_depot);
                        if(valeur_input_recharge != check){
                            if(e.handleObj.type == "change"){
                                $("#recharge-input").val(check);
                                $("#recharge-button").attr("href", base_url_recharge.replace("complement_url_recharge", String($("#recharge-input").val()).replace(/\s/g, '')));
                            }
                            else{
                                $("#recharge-button").attr("href", "javascript:void(0)");
                                $("#recharge-button").hide();
                            }
                        }
                        else{
                            $("#recharge-button").attr("href", base_url_recharge.replace("complement_url_recharge", String($("#recharge-input").val()).replace(/\s/g, '')));
                            $("#recharge-button").show();
                        }
                    }
                    else{
                        if(e.handleObj.type == "change"){
                            $("#recharge-input").val(multipleSuperieur(difference_solde_mise, minimum_depot));
                        }
                        else{
                            $("#recharge-button").attr("href", "javascript:void(0)");
                            $("#recharge-button").hide();
                        }
                    }
                });

                {% if rejoindre_partie_code %}
                    $("button[class='login privateChoice']").trigger("click");
                    //$("#code_partie_privee").val({{rejoindre_partie_code}});
                    $("#code_partie_privee").trigger("keyup");
                    $("#rejoindre_partie_privee-btn-rejoindre").trigger("click");
                {% endif %}

                // partie public selectionnee
