<!DOCTYPE html>
{% load static %}
{% load humanize %}
<html lang="fr">

<head>

	<meta charset="UTF-8">
	<meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=0'>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="Description" content={% block description %}"Plateforme de Livraison E-Commerce (Cash on Delivery - Paiement à la Livraison)"{% endblock %}>
	<meta name="Author" content={% block author %}"Benepub"{% endblock %}>
	<meta name="Keywords"
		content={% block Keywords %}"admin dashboard, admin dashboard html css, Plateforme de Livraison E-Commerce, Cash on Delivery, Paiement à la Livraison, ML SHIP AFRICA"{% endblock %}>

	<!-- Title -->
	<title>{% block title %}ML SHIP AFRICA{% endblock %}</title>

	<!-- Favicon -->
	<link rel="icon" href="{% static 'assets/img/brand/favicon.png' %}" type="image/x-icon">

	<!-- Icons css -->
	<link href="{% static 'assets/css/icons.css' %}" rel="stylesheet">

	<!-- Bootstrap css -->
	<link id="style" href="{% static 'assets/plugins/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">

	<!-- style css -->
	<link href="{% static 'assets/css/style.css' %}" rel="stylesheet">
	<link href="{% static 'assets/css/plugins.css' %}" rel="stylesheet">

	<!--- Animations css-->
	<link href="{% static 'assets/css/animate.css' %}" rel="stylesheet">

</head>

<body class="ltr error-page1 main-body bg-light text-dark error-3 login-img">


	<!-- Loader -->
	<div id="global-loader">
		<img src="{% static 'assets/img/loader.svg' %}" class="loader-img" alt="Loader">
	</div>
	<!-- /Loader -->

	<!-- Page -->
	<div class="page">

		<div class="container-fluid">
			<div class="row no-gutter">
				<!-- The image half -->
				<div class="col-md-6 col-lg-6 col-xl-7 d-none d-md-flex">
					<div class="row wd-100p mx-auto text-center">
						<div class="col-md-12 col-lg-12 col-xl-12 my-auto mx-auto wd-100p">
							<img src="{% static 'assets/img/brand/mlshipafrica-logo.png' %}"
								class="my-auto ht-xl-80p wd-md-100p wd-xl-80p mx-auto" alt="logo">
						</div>
					</div>
				</div>
				<!-- The content half -->
				<div class="col-md-6 col-lg-6 col-xl-5 bg-white">
					<div class="login d-flex align-items-center py-2">
						<!-- Demo content-->
						<div class="container p-0">
							<div class="row">
								<div class="col-md-10 col-lg-10 col-xl-9 mx-auto">
									<div class="card-sigin">
										<div class="mb-5 d-flex">
											<a href="{% url 'index' %}"><img src="{% static 'assets/img/brand/favicon.png' %}"
													class="sign-favicon-a ht-40" alt="logo">
												<img src="{% static 'assets/img/brand/favicon-light.png' %}"
													class="sign-favicon-b ht-40" alt="logo">
											</a>
											<h1 class="main-logo1 ms-1 me-0 my-auto tx-28">ML SHIP AFRICA</h1>
										</div>
			                            {% block content %}
										<div class="card-sigin">
											<div class="main-signup-header">
												<h2>Welcome back!</h2>
												<h5 class="fw-semibold mb-4">Please sign in to continue.</h5>
												<form>
													<div class="form-group">
														<label>Email</label> <input class="form-control"
															placeholder="Enter your email" type="text">
													</div>
													<div class="form-group">
														<label>Password</label> <input class="form-control"
															placeholder="Enter your password" type="password">
													</div>
													<a href="index.html" class="btn btn-main-primary btn-block">Sign
														In</a>
													<div class="row row-xs">
														<div class="col-sm-6">
															<button class="btn btn-block"><i
																	class="fa fa-facebook-f"></i> Signup with
																Facebook</button>
														</div>
														<div class="col-sm-6 mg-t-10 mg-sm-t-0">
															<button class="btn btn-info btn-block btn-b"><i
																	class="fa fa-twitter"></i> Signup with
																Twitter</button>
														</div>
													</div>
												</form>
												<div class="main-signin-footer mt-5">
													<p><a href="forgot.html">Forgot password?</a></p>
													<p>Don't have an account? <a href="signup.html">Create an
															Account</a></p>
												</div>
											</div>
										</div>
			                            {% endblock %}
									</div>
								</div>
							</div>
						</div><!-- End -->
					</div>
				</div><!-- End -->
			</div>
		</div>

	</div>
	<!-- End Page -->

	<!-----------------------------SCRIPTS--------------------------->
	{% block scripts %}
	<!-- JQuery min js -->
	<script src="{% static 'assets/plugins/jquery/jquery.min.js' %}"></script>

	<!-- Bootstrap Bundle js -->
	<script src="{% static 'assets/plugins/bootstrap/js/popper.min.js' %}"></script>
	<script src="{% static 'assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>

	<!-- Moment js -->
	<script src="{% static 'assets/plugins/moment/moment.js' %}"></script>

	<!-- Daterangepicker js-->
	<script src="{% static 'assets/plugins/bootstrap-daterangepicker/daterangepicker.js' %}"></script>

	<!-- P-scroll js -->
	<script src="{% static 'assets/plugins/perfect-scrollbar/perfect-scrollbar.min.js' %}"></script>

	<!-- eva-icons js -->
	<script src="{% static 'assets/js/eva-icons.min.js' %}"></script>

	<!--themecolor js-->
	<script src="{% static 'assets/js/themecolor.js' %}"></script>

	<!-- custom js -->
	<script src="{% static 'assets/js/custom.js' %}"></script>

	<!-- switcher-styles js -->
	<script src="{% static 'assets/js/swither-styles.js' %}"></script>

        <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Sélectionne tous les boutons de la page
            var buttons = document.querySelectorAll('button');
            // Parcourt chaque bouton et ajoute la classe 'xxx'
            buttons.forEach(function(button) {
                console.log(button.getAttribute('type'));
                button.classList.add("btn");
                if(button.getAttribute('type')=="submit"){
                    button.classList.add("btn-main-primary");
                }
                button.classList.add("btn-block");
            });
            // Sélectionne tous les input de la page
            var inputs = document.querySelectorAll("input");
            // Parcourt chaque input et ajoute la classe 'xxx'
            inputs.forEach(function(input) {
                input.classList.add("form-control");
            });
        });
    </script>

    <style>
        /* Styles CSS pour personnaliser le bouton */
        .error-section {
            background-size: auto;
        }

        .error-section .cmn-btn i {
            transform: none;
            margin-right: 10px;
        }

        .errorlist li {
            color: red;
        }
    </style>

	{% endblock %}

</body>

</html>
